name: Import v0.6 three-animation workspace

on:
  push:
    branches:
      - feat/three-animation-mvps-v06
    paths:
      - .import-v06/ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/three-animation-mvps-v06
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        run: |
          cat .import-v06/part-* | base64 --decode > /tmp/econlab-v06-src.tar.xz
          echo "56351d3249cc53e097b0f5ee5f236296e7bfbf9955e7c494a2cfb634bccc2993  /tmp/econlab-v06-src.tar.xz" | sha256sum -c -
          mkdir -p /tmp/econlab-v06
          tar -xJf /tmp/econlab-v06-src.tar.xz -C /tmp/econlab-v06

      - name: Replace branch workspace and validate
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/econlab-v06/. .
          python3 scripts/build_standalone.py
          python3 -m unittest discover -s tests -v
          for file in assets/*.js js/*.js; do node --check "$file"; done

      - name: Commit imported workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add three genuine mechanism-animation chapter MVPs"
          git push origin HEAD:feat/three-animation-mvps-v06
