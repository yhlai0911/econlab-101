name: Import v0.4 workspace

on:
  push:
    branches:
      - refactor/book-spread-v04
    paths:
      - .import/ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/book-spread-v04
          fetch-depth: 0

      - name: Reconstruct workspace archive
        run: |
          cat \
            .import/small-00 \
            .import/small-01 \
            .import/xz-01 \
            .import/xz-02 \
            .import/xz-03 \
            .import/xz-04 \
            .import/tail-05a \
            .import/tail-05b \
            .import/tail-06a \
            .import/tail-06b \
            .import/tail-07 \
            | base64 --decode > /tmp/econlab-v04.tar.xz
          echo "59f04a41fe280aeb7425dc9e433ad5a7b1be05b986c56ced76080e1af51ca78b  /tmp/econlab-v04.tar.xz" | sha256sum -c -
          mkdir -p /tmp/econlab-v04
          tar -xJf /tmp/econlab-v04.tar.xz -C /tmp/econlab-v04

      - name: Replace branch workspace
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/econlab-v04/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: publish v0.4 interactive book-spread lesson"
          git push origin HEAD:refactor/book-spread-v04
