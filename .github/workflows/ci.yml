name: Validate three animation MVPs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone
        run: python scripts/build_standalone.py
      - name: Static and model tests
        run: |
          python -m unittest discover -s tests -v
          node --check assets/animation-runtime.js
          node --check js/chapter-data.js
          node --check js/platform.js
          python -m py_compile scripts/*.py
      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 4173 >/tmp/econlab-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/ | grep -q 'EconLab 101'
          curl --fail --silent http://127.0.0.1:4173/media/video-manifest.json | grep -q 'macro-system'
